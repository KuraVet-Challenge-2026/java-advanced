spring.application.name=kuravet

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# O Hibernate
spring.jpa.hibernate.ddl-auto=validate

spring.thymeleaf.cache=false

# Actuator: so o health e exposto (usado pelo CD). Sem detalhes, apenas o status por componente.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

# Triagem por IA: extracao de sintomas com Gemini (fallback automatico para palavras-chave).
# A chave vem de LLM_API_KEY ou do application-local.properties; nunca versionar.
kuravet.ia.llm.enabled=${LLM_ENABLED:true}
kuravet.ia.llm.api-key=${LLM_API_KEY:}
kuravet.ia.llm.base-url=https://generativelanguage.googleapis.com/v1beta
kuravet.ia.llm.model=${LLM_MODEL:gemini-3.8-flash}
kuravet.ia.llm.timeout-ms=8000