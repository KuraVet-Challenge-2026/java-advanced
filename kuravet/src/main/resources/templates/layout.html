<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="cabeca(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'KuraVet - ' + ${titulo}">KuraVet</title>
    <link rel="stylesheet" th:href="@{/css/kuravet.css}">
</head>

<body>

<header class="topo" th:fragment="topo(pagina)">
    <div class="topo-interno">
        <!-- "/" redireciona para a area do perfil logado. -->
        <a class="marca" th:href="@{/}">KuraVet</a>
        <nav class="menu">
            <th:block sec:authorize="hasRole('VETERINARIO')">
                <a th:href="@{/portal/painel}" th:classappend="${pagina == 'painel'} ? 'ativo'">Painel</a>
                <a th:href="@{/portal/pets}" th:classappend="${pagina == 'pets'} ? 'ativo'">Pets</a>
                <a th:href="@{/portal/solicitacoes}" th:classappend="${pagina == 'solicitacoes'} ? 'ativo'">Solicitações</a>
                <a th:href="@{/portal/consultas}" th:classappend="${pagina == 'consultas'} ? 'ativo'">Consultas</a>
                <a th:href="@{/portal/triagens}" th:classappend="${pagina == 'triagens'} ? 'ativo'">Triagens</a>
            </th:block>
            <th:block sec:authorize="hasRole('TUTOR')">
                <a th:href="@{/tutor/consultas}" th:classappend="${pagina == 'tutor-consultas'} ? 'ativo'">Minhas consultas</a>
            </th:block>
        </nav>
        <div class="usuario">
            <span sec:authentication="name">usuario</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="botao botao-secundario">Sair</button>
            </form>
        </div>
    </div>
</header>

<div th:fragment="aviso">
    <p class="aviso aviso-sucesso" th:if="${sucesso}" th:text="${sucesso}"></p>
</div>

<!-- Paginas de erro: o menu so aparece para quem tem acesso ao portal. -->
<th:block th:fragment="topo-erro">
    <th:block sec:authorize="isAuthenticated()">
        <header th:replace="~{layout :: topo('')}"></header>
    </th:block>
</th:block>

<!-- Link de retorno para a area do perfil de quem esta vendo a pagina de erro. -->
<div th:fragment="voltar-perfil" class="acoes">
    <a sec:authorize="hasRole('VETERINARIO')" class="botao botao-principal"
       th:href="@{/portal/painel}">Voltar ao painel</a>
    <a sec:authorize="hasRole('TUTOR')" class="botao botao-principal"
       th:href="@{/tutor/consultas}">Ir para minhas consultas</a>
    <a sec:authorize="!hasRole('VETERINARIO') and !hasRole('TUTOR')" class="botao botao-principal"
       th:href="@{/login}">Ir para o login do portal</a>
</div>

</body>
</html>
