version: '3.8'

services:
  db:
    image: gvenzl/oracle-xe:slim
    container_name: oracle-db
    environment:
      - ORACLE_PASSWORD=230407
    ports:
      - "1521:1521"
    volumes:
      - oracledata:/opt/oracle/oradata

  api:
    build: .
    container_name: spring-api
    ports:
      - "80:8080"
    depends_on:
      - db
    environment:
      - SPRING_PROFILES_ACTIVE=docker

volumes:
  oracledata: