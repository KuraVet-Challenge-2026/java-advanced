# Pipeline CI do backend KuraVet (Spring Boot / Java 21).
# O projeto Maven fica em kuravet/; este arquivo fica na raiz do repositorio.

trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
  # Valores nao sensiveis do CD. A service connection precisa ser conhecida em
  # tempo de compilacao, por isso fica aqui e nao no variable group.
  azureSubscription: 'sc-kuravet-azure'
  resourceGroup: 'rg-kuravet-rm562396'
  webAppName: 'kuravet-rm562396'
  healthUrl: 'https://kuravet-rm562396.azurewebsites.net/actuator/health'

stages:
  - stage: CI
    displayName: "Build e testes"
    jobs:
      - job: BuildETestes
        displayName: "Build, testes e publicacao do artefato"
        steps:
          - task: JavaToolInstaller@0
            displayName: "Instalar JDK 21"
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: "Restaurar cache do repositorio Maven"
            inputs:
              key: 'maven | "$(Agent.OS)" | kuravet/pom.xml'
              path: $(MAVEN_CACHE_FOLDER)

          - bash: chmod +x mvnw && ./mvnw -B clean verify
            displayName: "Compilar e rodar os testes (mvnw)"
            workingDirectory: kuravet

          - task: PublishTestResults@2
            displayName: "Publicar resultados dos testes"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'kuravet/target/surefire-reports/TEST-*.xml'
              failTaskOnFailedTests: true
              testRunTitle: "KuraVet - testes unitarios"

          - bash: |
              set -euo pipefail
              shopt -s nullglob
              jars=()
              for jar in kuravet/target/kuravet-*.jar; do
                jars+=("$jar")
              done
              if [ "${#jars[@]}" -ne 1 ]; then
                echo "##vso[task.logissue type=error]Esperado exatamente 1 jar executavel em kuravet/target, encontrados: ${#jars[@]}"
                printf '%s\n' "${jars[@]}"
                exit 1
              fi
              cp "${jars[0]}" "$(Build.ArtifactStagingDirectory)/kuravet.jar"
              echo "Jar copiado: ${jars[0]} -> kuravet.jar"
            displayName: "Copiar jar executavel para a area de publicacao"

          - task: PublishPipelineArtifact@1
            displayName: "Publicar artefato kuravet-jar"
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/kuravet.jar
              artifact: kuravet-jar

  - stage: CD
    displayName: "Deploy no Azure Web App"
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      # Segredos (DB_URL, DB_USERNAME, DB_PASSWORD) so existem neste stage.
      - group: kuravet-producao
    jobs:
      - deployment: DeployWebApp
        displayName: "Deploy do jar no Web App"
        environment: 'producao'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: kuravet-jar
                  displayName: "Baixar artefato kuravet-jar"

                - bash: |
                    set -euo pipefail
                    mv "$(Pipeline.Workspace)/kuravet-jar/kuravet.jar" "$(Pipeline.Workspace)/kuravet-jar/app.jar"
                    echo "Jar renomeado para app.jar"
                  displayName: "Renomear jar para app.jar"

                - task: AzureAppServiceSettings@1
                  displayName: "Aplicar configuracoes do Web App"
                  inputs:
                    azureSubscription: ${{ variables.azureSubscription }}
                    appName: $(webAppName)
                    resourceGroupName: $(resourceGroup)
                    # O App Service Linux encaminha as requisicoes para a porta 80;
                    # SERVER_PORT faz o Spring Boot escutar nela.
                    appSettings: |
                      [
                        { "name": "DB_URL", "value": "$(DB_URL)", "slotSetting": false },
                        { "name": "DB_USERNAME", "value": "$(DB_USERNAME)", "slotSetting": false },
                        { "name": "DB_PASSWORD", "value": "$(DB_PASSWORD)", "slotSetting": false },
                        { "name": "LLM_API_KEY", "value": "$(LLM_API_KEY)", "slotSetting": false },
                        { "name": "SERVER_PORT", "value": "80", "slotSetting": false }
                      ]

                # OneDeploy (--type jar) em vez de ZIP Deploy: o rsync do Kudu
                # travava no AzureWebApp@1. --timeout esta em milissegundos.
                - task: AzureCLI@2
                  displayName: "Publicar app.jar no Web App (OneDeploy)"
                  inputs:
                    azureSubscription: ${{ variables.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az webapp config set --resource-group "$(resourceGroup)" --name "$(webAppName)" --startup-file "java -jar /home/site/wwwroot/app.jar" --output none
                      az webapp deploy --resource-group "$(resourceGroup)" --name "$(webAppName)" --src-path "$(Pipeline.Workspace)/kuravet-jar/app.jar" --type jar --restart true --timeout 600000

                - bash: |
                    set -uo pipefail
                    corpo="$(mktemp)"
                    for tentativa in $(seq 1 20); do
                      status="$(curl -s -o "$corpo" -w '%{http_code}' --max-time 10 "$(healthUrl)" || true)"
                      if [ "$status" = "200" ] && grep -q '"UP"' "$corpo"; then
                        echo "Health OK (HTTP 200, status UP) na tentativa $tentativa"
                        exit 0
                      fi
                      echo "Tentativa $tentativa/20: HTTP $status, aguardando 15 s..."
                      sleep 15
                    done
                    echo "##vso[task.logissue type=error]Health check falhou: $(healthUrl) nao respondeu HTTP 200 com status UP apos 20 tentativas"
                    exit 1
                  displayName: "Verificar /actuator/health"
